# Render Blueprint for PhishGuard AI
# Creates: PostgreSQL database + FastAPI backend (web service) + React frontend (static site)
#
# The frontend proxies /api/* to the backend, so the browser only talks to one origin
# and the auth cookie works without cross-site cookie problems.
#
# NOTE: if the name "phishguard-api" is already taken on Render, rename the service below
# AND update the rewrite destination + CORS_ORIGINS to match the URL Render assigns.

databases:
  - name: phishguard-db
    plan: free
    databaseName: phishguard
    user: phishguard

services:
  # ---------- Backend (FastAPI) ----------
  - type: web
    name: phishguard-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: phishguard-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: COOKIE_SECURE
        value: "true"
      - key: COOKIE_SAMESITE
        value: lax
      - key: CORS_ORIGINS
        value: '["https://phishguard-web-xxxx.onrender.com"]'
      # Optional - set these in the Render dashboard if you want them:
      - key: VIRUSTOTAL_API_KEY
        sync: false
      - key: GOOGLE_SAFE_BROWSING_KEY
        sync: false

  # ---------- Frontend (Vite + React) ----------
  - type: web
    name: phishguard-web
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      # Proxy API calls to the backend (same-origin for the browser)
      - type: rewrite
        source: /api/*
        destination: https://phishguard-api-fa32.onrender.com/api/*
      # SPA fallback for React Router
      - type: rewrite
        source: /*
        destination: /index.html
